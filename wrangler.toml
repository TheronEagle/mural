name = "mural-web"
main = "workers-site/index.js"
compatibility_date = "2025-01-01"

# Static site served from the Workers Static Assets store.
# `npm run build` assembles the minimal browser bundle into public/.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
AI_PROVIDER = "openrouter"
AI_MODEL = "meta-llama/llama-3.3-70b-instruct:free"
