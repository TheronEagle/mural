name = "mural-web"
main = "workers-site/index.js"
compatibility_date = "2025-01-01"

# `public/` is committed (CI runs `npx wrangler deploy` with no build step) and
# contains only the browser bundle. Regenerate it with `npm run build`; the
# `npm test` drift check fails if it falls out of sync with source.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
AI_PROVIDER = "openrouter"
AI_MODEL = "meta-llama/llama-3.3-70b-instruct:free"
